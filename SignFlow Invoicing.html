<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignFlow Invoicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',Helvetica,Arial,sans-serif;font-size:15px;color:#000;background:#fff}
.app{display:flex;height:100vh;min-height:800px}
.sidebar{width:220px;background:#fff;border-right:0.5px solid rgba(0,0,0,.1);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:14px 16px 2px}
.logo-name{font-size:15px;font-weight:600;font-style:italic;color:#000}
.logo-sub{font-size:11px;font-weight:500;color:#555}
.nav-label{font-size:10px;font-weight:700;color:#555;letter-spacing:.08em;text-transform:uppercase;padding:2px 16px 5px}
.nav-item{display:flex;align-items:center;gap:8px;margin:6px 12px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;color:#fff;background:#185FA5;cursor:pointer}
.nav-item:hover{background:#185FA5}
.nav-item.active{background:#185FA5}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:0.5px solid rgba(0,0,0,.1);font-size:11px;font-weight:500;color:#555}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,.1);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-family:'Inter',sans-serif;font-size:19px;font-weight:600;color:#000}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid rgba(0,0,0,.2);background:#fff;color:#000}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#185FA5;color:#fff;border-color:#185FA5}
.btn-primary:hover{background:#0C447C}
.btn-sm{padding:4px 11px;font-size:11.5px}
.btn-green{background:#EAF3DE;color:#27500A;border-color:#97C459}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
.form-input{padding:7px 11px;border:1px solid rgba(0,0,0,.2);border-radius:8px;font-size:12.5px;font-weight:500;background:#fff;color:#000}
.date-input{padding:7px 10px;border:1.5px solid #000;border-radius:8px;font-size:13px;font-weight:400;font-family:'Poppins',Helvetica,Arial,sans-serif;background:#fff;color:#000}
.form-select{padding:7px 11px;border:1px solid rgba(0,0,0,.2);border-radius:8px;font-size:12.5px;font-weight:500;background:#fff;color:#000}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 20px;flex-shrink:0}
.stat-card{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:11px 14px}
.stat-label{font-size:12px;font-weight:600;color:#000;margin-bottom:3px}
.stat-val{font-size:21px;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-paid{background:#EAF3DE;color:#27500A}
.badge-unpaid{background:#FAEEDA;color:#633806}
.badge-overdue{background:#FCEBEB;color:#791F1F}
.badge-partial{background:#FFF3CD;color:#856404}
.badge-agent{background:#E1F5EE;color:#085041}
.badge-office{background:#EEEDFE;color:#3C3489}
.badge-removal{background:#F1EFE8;color:#5F5E5A}
.filter-bar{padding:10px 20px;background:#fff;border-bottom:0.5px solid rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.inv-table{width:100%;border-collapse:collapse;margin-top:10px}
.inv-table th{font-size:12.5px;font-weight:700;color:#000;text-align:left;padding:9px 12px;border-bottom:1px solid rgba(0,0,0,.12);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:#fff;position:sticky;top:0;z-index:2}
.inv-table td{padding:11px 12px;font-size:13.5px;font-weight:500;color:#000;border-bottom:0.5px solid rgba(0,0,0,.08);vertical-align:middle}
.inv-table tbody tr:hover td{background:#f5f5f5;cursor:pointer}
.inv-table tbody tr.selected td{background:#E6F1FB}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.email-link{color:#185FA5;text-decoration:none;font-size:12.5px;font-weight:500}
.email-link:hover{text-decoration:underline}
.drawer{width:360px;background:#fff;border-left:0.5px solid rgba(0,0,0,.1);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.drawer.closed{width:0;overflow:hidden;border:none}
.drawer-header{padding:14px 16px;border-bottom:0.5px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-header span{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:#000}
.drawer-body{flex:1;overflow-y:auto}
.inv-preview{padding:18px}
.inv-items{width:100%;border-collapse:collapse;margin-bottom:12px}
.inv-items th{font-size:11px;font-weight:700;color:#000;text-align:left;padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.12);text-transform:uppercase}
.inv-items td{font-size:12px;font-weight:500;padding:7px 8px;border-bottom:0.5px solid rgba(0,0,0,.07);color:#000}
.inv-items tr.removal-row td{color:#888;font-style:italic}
.inv-total-block{background:#f5f5f5;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.inv-actions{display:flex;flex-direction:column;gap:7px}
.check-cell{width:18px;height:18px;border:2px solid #000;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.check-cell.on{background:#185FA5;border-color:#185FA5;color:#fff}
.build-panel{padding:18px 20px;flex:1;overflow-y:auto}
.range-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.note-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;background:#F1EFE8;color:#5F5E5A;font-style:italic}
</style>
</head>

    <div class="content">

      <!-- ALL INVOICES -->
      <div class="panel active" id="panel-all" style="overflow-y:auto">
        <!-- CREATE INVOICES — fully merged into the All Invoices screen, always visible -->
        <div id="create-invoices-section" style="display:flex;flex-direction:column;flex-shrink:0;border-bottom:1px solid rgba(0,0,0,.12);margin-bottom:10px">
          <div style="padding:0 20px 16px">
            <div style="font-size:15px;font-weight:600;margin-bottom:4px">Create Invoices</div>

            <div class="range-row" style="margin-bottom:16px">
              <select class="date-input" id="range-mode" onchange="updateRangeMode()">
                <option value="today">Today</option>
                <option value="single">Specific Day</option>
                <option value="range" selected>Specific Date Range</option>
              </select>
              <span id="range-single-fields" style="display:none;align-items:center;gap:8px">
                <input type="date" class="date-input" id="range-single" value="2026-04-21">
              </span>
              <span id="range-dual-fields" style="display:flex;align-items:center;gap:8px">
                <input type="date" class="date-input" id="range-from" value="2026-04-01">
                <span style="font-size:12px;color:#000">to</span>
                <input type="date" class="date-input" id="range-to" value="2026-04-21">
              </span>
              <span style="width:1px;align-self:stretch;background:rgba(0,0,0,.12);margin:0 4px"></span>
              <select class="date-input" id="build-group">
                <option value="agent">Per agent</option>
                <option value="office">Per office</option>
                <option value="both">Both</option>
              </select>
              <button class="btn btn-primary" onclick="buildInvoices()">Generate Invoices</button>
            </div>

            <div id="build-results-wrap" style="display:none">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <div style="font-size:11px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.04em">2. Review &amp; choose who gets invoiced</div>
                <button class="btn btn-sm" onclick="setAllBuildExcluded(false)">Select all</button>
                <button class="btn btn-sm" onclick="setAllBuildExcluded(true)">Select none</button>
              </div>
              <div id="build-results" style="max-height:360px;overflow-y:auto;border:1px solid rgba(0,0,0,.1);border-radius:8px"></div>
            </div>
          </div>
          <div id="build-action-bar" style="display:none;flex-shrink:0;background:#fff;border-top:1px solid rgba(0,0,0,.12);padding:12px 20px;align-items:center;gap:10px">
            <span id="build-selection-label" style="font-size:13px;font-weight:600"></span>
            <button class="btn btn-primary" onclick="sendBuiltInvoices()" id="build-send-btn">Create &amp; send selected</button>
            <button class="btn" onclick="exportExcludedBuild()" id="build-export-btn">Export</button>
          </div>
        </div>

        <div class="filter-bar">
          <input class="form-input" placeholder="Search name or office..." id="inv-search" oninput="renderInvTable()" style="width:220px;border:2px solid #000;font-weight:600;padding:9px 12px">

        </div>

          <span id="invlist-bulk-label" style="font-size:13px;font-weight:600;color:#fff">0 selected</span>
          <button class="btn btn-sm" onclick="sendSelectedInvoices()" id="bulk-send-btn" style="background:#fff;color:#185FA5;border-color:#fff;font-weight:700">Email Selected</button>
        </div>

          <div style="flex:1;padding:0 20px 20px;min-width:0">
            <table class="inv-table">
              <thead><tr>

          <div style="display:flex;align-items:center;gap:8px;margin:14px 0 10px;flex-wrap:wrap">
            <input class="form-input" placeholder="Search name or office..." id="history-search" oninput="renderHistoryTable()" style="width:220px;border:2px solid #000;font-weight:600;padding:9px 12px">
            <label style="font-size:12px;font-weight:600;color:#000">Paid From</label>
            <input type="date" class="date-input" id="history-date-from" onchange="renderHistoryTable()">

            </tr></thead>

function ini(a){return(a.first[0]+(a.last[0]||'')).toUpperCase()}
function fmtDate(d){if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function fmtDateOrdinal(d){
  if(!d)return'—';
  const dt=new Date(d+'T00:00:00');
  const day=dt.getDate();
  const suffix=(day%10===1&&day!==11)?'st':(day%10===2&&day!==12)?'nd':(day%10===3&&day!==13)?'rd':'th';
  const month=dt.toLocaleDateString('en-US',{month:'long'});
  return `${month} ${day}${suffix}, ${dt.getFullYear()}`;
}

function fmtPeriod(p){
  // period is stored as "Mon YYYY" (e.g. "Mar 2026"); billing always runs on the 1st of the month.
  if(!p)return'—';
  const [mon,year]=p.split(' ');
  const monthNames={Jan:'January',Feb:'February',Mar:'March',Apr:'April',May:'May',Jun:'June',Jul:'July',Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December'};
  return `${monthNames[mon]||mon} 1st, ${year}`;
}
function fmtMoney(n){return n===0?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function isBillable(type){return BILLABLE.includes(type)}

// Partial-payment tracking: each invoice keeps a `payments` array (date/amount/method).
// paidAmount and balance are derived, never stored directly, so they're always accurate.
function invPaid(inv){return (inv.payments||[]).reduce((s,p)=>s+p.amount,0)}
function invBalance(inv){return Math.round((inv.amount-invPaid(inv))*100)/100}
function invDisplayStatus(inv){
  const bal=invBalance(inv);
  if(bal<=0)return'paid';
  if(invPaid(inv)>0)return'partial';
  return inv.status; // 'unpaid' or 'overdue', as set on the invoice
}
function invBadgeClass(ds){return{paid:'badge-paid',partial:'badge-partial',overdue:'badge-overdue',unpaid:'badge-unpaid'}[ds]}
function invStatusLabel(ds){return{paid:'Paid',partial:'Partial',overdue:'Overdue',unpaid:'Unpaid'}[ds]}

  if(id==='payouts') renderPayoutsTable();
  renderInvTable();updateStats();
}

// Stripe's standard US card rate: 2.9% + $0.30 per transaction.
function stripeFee(amount){return Math.round((amount*0.029+0.30)*100)/100}

function cardPaymentsByDate(){
  const byDate={};
  INVOICES.forEach(inv=>{
    (inv.payments||[]).forEach(p=>{
      if(!p.method.match(/([A-Za-z]+ •{4} ?\d{4})/))return; // card charges only — checks never go through Stripe
      if(!byDate[p.date])byDate[p.date]=[];
      byDate[p.date].push({invId:inv.id,billTo:inv.billTo,company:companyForInvoice(inv),amount:p.amount,method:p.method});
    });
  });
  return byDate;
}

function renderPayoutsTable(){
  const byDate=cardPaymentsByDate();
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  document.getElementById('payouts-tbody').innerHTML=dates.map(date=>{
    const txns=byDate[date];
    const gross=txns.reduce((s,t)=>s+t.amount,0);
    const fee=Math.round(txns.reduce((s,t)=>s+stripeFee(t.amount),0)*100)/100;
    const net=Math.round((gross-fee)*100)/100;
    return`<tr onclick="openPayoutDetail('${date}')">
      <td style="font-size:13px;font-weight:600">${fmtDate(date)}</td>
      <td style="font-size:13px">${txns.length}</td>
      <td style="font-weight:500">${fmtMoney(gross)}</td>
      <td style="color:#791F1F">− ${fmtMoney(fee)}</td>

      <td><button class="btn btn-sm" onclick="event.stopPropagation();openPayoutDetail('${date}')">View</button></td>

  }).join('')||`<tr><td colspan="6" style="padding:24px;text-align:center;color:#000;font-size:13px">No card payouts yet.</td></tr>`;
}

function openPayoutDetail(date){

  const net=Math.round((gross-fee)*100)/100;

  document.getElementById('inv-preview').innerHTML=`
    <div style="font-size:11px;color:#777;margin-bottom:10px">Deposited to your bank account, grouping every card charge from ${fmtDate(date)}.</div>

      <div style="display:flex;justify-content:space-between;padding:3px 0;color:#791F1F"><span>Stripe fee</span><span>− ${fmtMoney(fee)}</span></div>
      <div style="display:flex;justify-content:space-between;padding-top:6px;margin-top:4px;border-top:1px solid rgba(0,0,0,.1);font-size:15px;font-weight:800;color:#27500A"><span>Net deposit</span><span>${fmtMoney(net)}</span></div>
    </div>`;
  document.getElementById('inv-drawer').classList.remove('closed');
}

function invNum(id){return parseInt((id||'').replace('INV-',''))||0}
function periodSortValue(p){
  // period is stored as "Mon YYYY" (e.g. "Mar 2026") — convert to a real date for sorting
  if(!p)return 0;
  const d=new Date(p+' 1');
  return isNaN(d)?0:d.getTime();
}

function companyForInvoice(inv){
  if(inv.type==='office'){
    const o=OFFICES.find(x=>x.id===inv.officeId);
    return o?o.name:'—';
  }
  const agent=AGENTS.find(a=>a.id===inv.agentId);
  const o=agent?OFFICES.find(x=>x.id===agent.officeId):null;
  return o?o.name:'—';
}

function getFiltered(){
  const s=document.getElementById('inv-search').value.toLowerCase();
  return INVOICES.filter(i=>{
    if(invDisplayStatus(i)==='paid')return false; // paid-in-full invoices live in Payment History, not the working list
    if(s&&!i.billTo.toLowerCase().includes(s))return false;
    return true;
  }).sort((a,b)=>periodSortValue(b.period)-periodSortValue(a.period)||invNum(b.id)-invNum(a.id)); // newest Date Sent first, invoice number as tiebreaker
}

function clearHistoryDateFilter(){
  document.getElementById('history-date-from').value='';
  document.getElementById('history-date-to').value='';
  renderHistoryTable();
}

function lastPaidDateFor(inv){
  const payments=inv.payments||[];
  return payments.length?payments.reduce((latest,p)=>p.date>latest?p.date:latest,payments[0].date):null;
}

function renderHistoryTable(){
  const s=(document.getElementById('history-search')?.value||'').toLowerCase();
  const dateFrom=document.getElementById('history-date-from')?.value||'';
  const dateTo=document.getElementById('history-date-to')?.value||'';
  const paid=INVOICES.filter(i=>{
    if(invDisplayStatus(i)!=='paid')return false;
    if(s&&!i.billTo.toLowerCase().includes(s))return false;
    const paidDate=lastPaidDateFor(i);
    if(dateFrom&&(!paidDate||paidDate<dateFrom))return false;
    if(dateTo&&(!paidDate||paidDate>dateTo))return false;
    return true;
  }).sort((a,b)=>periodSortValue(b.period)-periodSortValue(a.period)||invNum(b.id)-invNum(a.id));
  const tbody=document.getElementById('history-tbody');
  if(!tbody)return;
  tbody.innerHTML=paid.map(inv=>{
    const payments=inv.payments||[];
    const lastPaidDate=lastPaidDateFor(inv);
    const methods=[...new Set(payments.map(p=>p.method))].join(', ');
    const hasCardPayment=payments.some(p=>p.method.match(/([A-Za-z]+ •{4} ?\d{4})/));
    return`<tr onclick="openHistoryInvoice('${inv.id}')">
      <td style="font-size:12px;font-weight:500;color:#185FA5">${inv.id}</td>
      <td style="font-size:12px;font-weight:600;color:#000">${companyForInvoice(inv)}</td>
      <td style="font-size:13px;font-weight:500">${inv.billTo}</td>
      <td style="font-size:12px;color:#000">${fmtPeriod(inv.period)}${inv.sentAt?`<div style="font-size:12.5px;font-weight:600;color:#333">${inv.sentAt}</div>`:''}</td>
      <td style="font-weight:500">
        ${fmtMoney(inv.amount)}
        ${(inv.refunds||[]).map(r=>`<div style="font-size:10px;color:#E24B4A;font-weight:600;margin-top:1px">Refunded ${fmtMoney(r.amount)} ${fmtDateOrdinal(r.date)}</div>`).join('')}
      </td>
      <td style="font-size:12px;color:#000">${lastPaidDate?fmtDate(lastPaidDate):'—'}</td>
      <td style="font-size:12px;color:#000">${methods||'—'}</td>
      <td><button class="btn btn-sm" onclick="event.stopPropagation();openHistoryInvoice('${inv.id}')">${hasCardPayment?'REFUND':'VIEW'}</button></td>
    </tr>`;
  }).join('')||`<tr><td colspan="8" style="padding:24px;text-align:center;color:#000;font-size:13px">No paid invoices yet.</td></tr>`;
}

  let pdfs=0,receipts=0,links=0;

  });

    const btn=document.getElementById(id);
    btn.disabled=noneSelected;
    btn.style.opacity=noneSelected?'.4':'1';
    btn.style.cursor=noneSelected?'not-allowed':'pointer';
  });
  document.getElementById('inv-tbody').innerHTML=filtered.map(inv=>{
    const ds=invDisplayStatus(inv);
    const isPaid=ds==='paid';
    const balance=invBalance(inv);
    const agent=inv.agentId?AGENTS.find(a=>a.id===inv.agentId):null;
    const billEntity=inv.type==='office'?OFFICES.find(o=>o.id===inv.officeId):agent;

        <div style="font-size:13px;font-weight:500">${inv.billTo}</div>
        <a class="email-link" href="mailto:${inv.email}" onclick="event.stopPropagation()">${inv.email}</a>
        ${inv.cc?`<div style="font-size:10.5px;color:#000">cc: ${inv.cc}</div>`:''}
      </td>
      <td style="font-size:12px;color:#000">${fmtPeriod(inv.period)}${inv.sentAt?`<div style="font-size:12.5px;font-weight:600;color:#333">${inv.sentAt}</div>`:''}</td>
      <td style="font-weight:500">
        ${fmtMoney(inv.amount)}
        ${ds==='partial'?`<div style="font-size:10px;color:#E24B4A;font-weight:500;margin-top:1px">${fmtMoney(balance)} due · ${fmtMoney(invPaid(inv))} paid</div>`:''}
        ${inv.billing==='auto'?`<div style="font-size:10px;font-weight:700;color:#E24B4A;text-transform:uppercase;letter-spacing:.03em;margin-top:1px">Auto Pay</div>`:''}
        ${!isPaid?(inv.billing==='auto'
          ?(chargingId===inv.id
            ?`<div onclick="event.stopPropagation()" style="margin-top:2px;font-size:11px"><span style="color:#333">Charge now?</span> <span onclick="event.stopPropagation();chargeNow('${inv.id}')" style="cursor:pointer;color:#185FA5;font-weight:700;text-decoration:underline">Yes</span> <span onclick="event.stopPropagation();cancelCharge()" style="cursor:pointer;color:#000;text-decoration:underline">Cancel</span></div>`
            :`<div onclick="event.stopPropagation();startCharge('${inv.id}')" title="${card?`${card.brand} •••• ${card.last4} · exp ${card.exp}`:'No card on file'}" style="font-size:11px;font-weight:600;color:#185FA5;cursor:pointer;margin-top:2px;text-decoration:underline">Charge now</div>`)
          :`<div onclick="event.stopPropagation();openInvoice('${inv.id}')" style="font-size:11px;font-weight:600;color:#27500A;cursor:pointer;margin-top:2px;text-decoration:underline">Record payment</div>`):''}
        ${ds==='overdue'?`<div onclick="event.stopPropagation();sendReminder('${inv.id}')" style="font-size:11px;font-weight:600;color:#791F1F;cursor:pointer;margin-top:2px;text-decoration:underline">Send reminder</div>`:''}
      </td>
      <td><div style="display:flex;gap:5px;white-space:nowrap;align-items:center">
        <button class="btn btn-sm" onclick="event.stopPropagation();sendOne('${inv.id}')">${inv.billing==='invoice'?'Email PDF':inv.billing==='auto'?'Email receipt':'Send link'}</button>
        <button class="btn btn-sm" onclick="event.stopPropagation();exportExcel()">Export</button>
        ${deletingRowId===inv.id
          ?`<span onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:6px;font-size:11px">
              <span style="color:#791F1F">Delete?</span>
              <span onclick="deleteInvoiceRow('${inv.id}')" style="cursor:pointer;color:#791F1F;font-weight:700;text-decoration:underline">Yes</span>
              <span onclick="cancelDeleteRow()" style="cursor:pointer;color:#000;text-decoration:underline">Cancel</span>
            </span>`
          :`<button class="btn btn-sm" style="border-color:#E24B4A;color:#E24B4A" onclick="event.stopPropagation();startDeleteRow('${inv.id}')">Delete</button>`}
      </div></td>
    </tr>`;
  }).join('')||`<tr><td colspan="10" style="padding:24px;text-align:center;color:#000;font-size:13px">No invoices match this filter.</td></tr>`;
}

function openInvoice(id){
  selectedInvId=id;
  const inv=INVOICES.find(i=>i.id===id);
  const agent=inv.agentId?AGENTS.find(a=>a.id===inv.agentId):null;
  const billEntity=inv.type==='office'?OFFICES.find(o=>o.id===inv.officeId):agent;
  document.getElementById('inv-drawer').classList.remove('closed');
  document.getElementById('drawer-title').textContent=inv.id;
  const isOffice=inv.type==='office';
  const invOrders=inv.orders.map(oid=>ORDERS.find(o=>o.id===oid)).filter(Boolean).filter(o=>o.type!=='remove');
  const billableTotal=invOrders.filter(o=>isBillable(o.type)).reduce((s,o)=>s+o.amount,0);
  const tripChargeCount=invOrders.filter(o=>o.type==='tripcharge').length;

  const lines=invOrders.map(o=>{

      <td>${fmtDate(o.date)}</td>
      <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.addr}</td>
      <td>${SERVICE_LABELS[o.type]}${isTrip?' <span style="font-size:9px;color:#BA7517">(stop — could not complete)</span>':''}</td>
      ${isOffice?`<td>${a?a.first+' '+a.last:'—'}</td>`:''}
      <td style="text-align:right;font-weight:500;color:${isTrip?'#BA7517':'#111'}">${fmtMoney(o.amount)}</td>
    </tr>`;
  }).join('');

  const ds=invDisplayStatus(inv);
  const isPaid=ds==='paid';
  const paidAmt=invPaid(inv);
  const balance=invBalance(inv);
  document.getElementById('inv-preview').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:15px;font-weight:500">${inv.id}</div>
      <span class="badge ${invBadgeClass(ds)}">${invStatusLabel(ds)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px solid rgba(0,0,0,.1)">
      <div style="font-size:11px;color:#000;line-height:1.7"><div style="font-weight:500">Sign Up Sign Services</div><div>SignUpTucson.com</div><div>Tucson, AZ</div></div>
      <div style="font-size:11px;color:#000;line-height:1.7;text-align:right">
        <div style="font-weight:500">${inv.billTo}</div>
        <div><a class="email-link" href="mailto:${inv.email}">${inv.email}</a></div>
        ${inv.cc?`<div style="font-size:10px;color:#000">cc: ${inv.cc}</div>`:''}
        <div style="margin-top:4px;font-size:10px;color:#000">Date Sent: ${fmtPeriod(inv.period)}${inv.sentAt?` · <span style="font-size:12px;font-weight:700">${inv.sentAt}</span>`:''}</div>
        <div style="font-size:10px;color:#000">Due: ${fmtDate(inv.due)}</div>
      </div>
    </div>
    ${tripChargeCount?`<div style="font-size:11px;color:#856404;background:#FFF3CD;padding:6px 10px;border-radius:6px;margin-bottom:10px">Includes ${tripChargeCount} trip charge${tripChargeCount>1?'s':''} — a stop where the installer couldn't complete the job.</div>`:''}
    <table class="inv-items">
      <thead><tr><th>Date</th><th>Address</th><th>Service</th>${isOffice?'<th>Agent</th>':''}<th style="text-align:right">Amount</th></tr></thead>
      <tbody>${lines}</tbody>
    </table>
    <div class="inv-total-block">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#000"><span>Billable orders</span><span>${invOrders.filter(o=>isBillable(o.type)).length}</span></div>
      <div style="height:0.5px;background:rgba(0,0,0,.1);margin:8px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:500"><span>Invoice total</span><span>${fmtMoney(billableTotal)}</span></div>
    </div>
    ${(inv.payments&&inv.payments.length>0)?`
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:500;color:#000;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Payments received</div>
      ${(inv.payments||[]).map((p,idx)=>{
        const rowKey=inv.id+'-'+idx;
        const isConfirming=confirmingRemove===rowKey;
        const isRefunding=refundingRow===rowKey;
        const cardMatch=p.method.match(/([A-Za-z]+ •{4} ?\d{4})/);
        const refundTarget=cardMatch?cardMatch[1]:p.method;
        return`
      <div style="padding:3px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px">
          <span style="color:#000">${fmtDate(p.date)} · ${p.method}</span>
          <span style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span style="font-weight:500;color:#27500A">${fmtMoney(p.amount)}</span>
            ${isConfirming
              ?`<span style="font-size:11px;color:#791F1F">Remove?</span>
                 <span onclick="removePayment('${inv.id}',${idx})" style="cursor:pointer;color:#791F1F;font-weight:700;font-size:11px;text-decoration:underline">Yes</span>
                 <span onclick="cancelRemovePayment()" style="cursor:pointer;color:#000;font-size:11px;text-decoration:underline">Cancel</span>`
              :`<span onclick="confirmRemovePayment('${rowKey}')" title="Remove this payment" style="cursor:pointer;color:#E24B4A;font-weight:700;font-size:15px;line-height:1;padding:0 4px">×</span>
                ${cardMatch?`<span onclick="startRefund('${rowKey}')" style="cursor:pointer;color:#185FA5;font-weight:600;font-size:11px;text-decoration:underline">Refund</span>`:''}`}
          </span>
        </div>
        ${isRefunding?`
        <div style="display:flex;gap:6px;align-items:center;margin-top:6px;padding:8px;background:#EAF0FB;border-radius:6px;flex-wrap:wrap">
          <span style="font-size:10.5px;color:#333;white-space:nowrap">Refund to ${refundTarget}:</span>
          <input type="number" step="0.01" class="form-input" id="refund-amount-${idx}" placeholder="${p.amount.toFixed(2)}" style="width:75px">
          <button class="btn btn-sm btn-primary" onclick="confirmRefund('${inv.id}',${idx})">Confirm</button>
          <button class="btn btn-sm" onclick="cancelRefund()">Cancel</button>
          <div style="width:100%;font-size:9.5px;color:#666">This is final — the invoice stays marked paid and does not reopen.</div>
        </div>`:''}
      </div>`;}).join('')}
      <div style="display:flex;justify-content:space-between;font-size:12px;padding-top:4px;margin-top:4px;border-top:0.5px solid rgba(0,0,0,.08);font-weight:500">
        <span>Balance ${isPaid?'':'due'}</span><span style="color:${isPaid?'#27500A':'#791F1F'}">${fmtMoney(balance)}</span>
      </div>
    </div>`:''}
    ${(inv.refunds&&inv.refunds.length>0)?`
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:500;color:#791F1F;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Refunds issued</div>
      ${inv.refunds.map(r=>`
      <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0">
        <span style="color:#000">${fmtDate(r.date)} · to ${r.target}</span>
        <span style="font-weight:500;color:#791F1F">− ${fmtMoney(r.amount)}</span>
      </div>`).join('')}
      <div style="font-size:10px;color:#999;margin-top:4px">Refunds are final and don't change this invoice's paid status.</div>
    </div>`:''}
    ${(!isPaid&&inv.billing==='auto')?`
    <div style="background:#EAF0FB;border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div style="font-size:11px;color:#333">Autopay hasn't charged this yet — scheduled for ${fmtDate(inv.due)}.${(billEntity&&billEntity.card)?` Card on file: ${billEntity.card.brand} •••• ${billEntity.card.last4} · exp ${billEntity.card.exp}.`:' No card on file.'}</div>
      ${chargingId===inv.id
        ?`<div style="display:flex;align-items:center;gap:8px;white-space:nowrap"><span style="font-size:11px;color:#333">Charge now?</span><button class="btn btn-sm btn-primary" onclick="chargeNow('${inv.id}')">Yes</button><button class="btn btn-sm" onclick="cancelCharge()">Cancel</button></div>`
        :`<button class="btn btn-sm btn-primary" style="white-space:nowrap" onclick="startCharge('${inv.id}')" title="${(billEntity&&billEntity.card)?`${billEntity.card.brand} •••• ${billEntity.card.last4} · exp ${billEntity.card.exp}`:'No card on file'}">Charge now</button>`}
    </div>`:''}
    ${(!isPaid&&inv.billing!=='auto')?`
    <div style="background:#f5f5f5;border-radius:8px;padding:10px 12px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:500;color:#000;margin-bottom:6px">Record a payment</div>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="number" step="0.01" class="form-input" id="pay-amount" placeholder="${balance.toFixed(2)}" style="width:80px">
        <input type="text" class="form-input" id="pay-method" placeholder="Check #" style="flex:1">
        <button class="btn btn-sm btn-green" onclick="recordPayment('${inv.id}')">Record</button>
      </div>
    </div>`:''}
    <div class="inv-actions">
      <button class="btn btn-primary" style="font-size:12px" onclick="sendOne('${inv.id}')">${inv.billing==='invoice'?'Email as PDF':inv.billing==='auto'?'Email receipt':'Send pay-now link'}</button>
      ${ds==='overdue'?`<button class="btn" style="font-size:12px;border-color:#E24B4A;color:#791F1F" onclick="sendReminder('${inv.id}')">Send past-due reminder</button>`:''}
      <button class="btn" style="font-size:12px" onclick="exportExcel()">Export to Excel</button>
      <button class="btn" style="font-size:12px" onclick="alert('Print view opens in production')">Print invoice</button>
    </div>`;
  renderInvTable();
}

function startCharge(id){
  chargingId=id;
  renderInvTable();
  if(selectedInvId===id)openInvoice(id);
}

function cancelCharge(){
  chargingId=null;
  renderInvTable();
  if(selectedInvId)openInvoice(selectedInvId);
}

function chargeNow(id){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv) return;
  const entity=inv.type==='office'?OFFICES.find(o=>o.id===inv.officeId):AGENTS.find(a=>a.id===inv.agentId);
  const card=entity&&entity.card;
  if(!card){alert(`No card on file for ${inv.billTo} — add one to their record before charging.`);return;}
  const balance=invBalance(inv);
  const today=new Date().toISOString().slice(0,10);
  if(!inv.payments)inv.payments=[];
  inv.payments.push({date:today,amount:balance,method:`Autopay — ${card.brand} •••• ${card.last4} exp ${card.exp} (charged early)`});
  chargingId=null;
  renderInvTable();updateStats();renderHistoryTable();
  if(document.getElementById('inv-drawer')&&!document.getElementById('inv-drawer').classList.contains('closed')&&selectedInvId===id)openInvoice(id);
}

function recordPayment(id){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv) return;
  const balance=invBalance(inv);
  const amtInput=document.getElementById('pay-amount').value;
  const amount=amtInput?parseFloat(amtInput):balance;
  if(!amount||amount<=0){alert('Enter a payment amount greater than $0.');return;}
  const method=document.getElementById('pay-method').value.trim()||'Check';
  const today=new Date().toISOString().slice(0,10);
  if(!inv.payments)inv.payments=[];
  inv.payments.push({date:today,amount:Math.round(amount*100)/100,method});
  openInvoice(id);
  updateStats();renderHistoryTable();
}

function confirmRemovePayment(rowKey){
  confirmingRemove=rowKey;
  refundingRow=null;
  openInvoice(selectedInvId);
}

function cancelRemovePayment(){
  confirmingRemove=null;
  openInvoice(selectedInvId);
}

function removePayment(id,idx){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv||!inv.payments||!inv.payments[idx]) return;
  inv.payments.splice(idx,1);
  confirmingRemove=null;
  openInvoice(id);
  updateStats();renderHistoryTable();
}

function startRefund(rowKey){
  refundingRow=rowKey;
  confirmingRemove=null;
  const invId=rowKey.slice(0,rowKey.lastIndexOf('-'));
  openInvoice(invId);
}

function cancelRefund(){
  refundingRow=null;
  if(selectedInvId)openInvoice(selectedInvId);
}

function confirmRefund(id,idx){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv||!inv.payments||!inv.payments[idx])return;
  const original=inv.payments[idx];
  const input=document.getElementById(`refund-amount-${idx}`).value;
  const amount=input?parseFloat(input):original.amount;
  if(!amount||amount<=0||amount>original.amount){alert(`Enter an amount between $0.01 and ${fmtMoney(original.amount)}.`);return;}
  const cardMatch=original.method.match(/([A-Za-z]+ •{4} ?\d{4})/);
  const target=cardMatch?cardMatch[1]:`original payment method (${original.method})`;
  const today=new Date().toISOString().slice(0,10);
  if(!inv.refunds)inv.refunds=[];
  inv.refunds.push({date:today,amount,target});
  refundingRow=null;
  openInvoice(id);
  renderInvTable();updateStats();renderHistoryTable();
}

function closeDrawer(){selectedInvId=null;confirmingRemove=null;refundingRow=null;document.getElementById('inv-drawer').classList.add('closed');renderInvTable();}

function sendOne(id){
  const inv=INVOICES.find(i=>i.id===id);
  const ccNote=inv.cc?`, cc ${inv.cc}`:'';
  const msg=inv.billing==='invoice'?`PDF invoice emailed to ${inv.email}`:inv.billing==='auto'?`Receipt emailed to ${inv.email}`:`Pay-now link sent to ${inv.email}`;
  alert(msg+ccNote);
}

function sendReminder(id){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv) return;
  const ccNote=inv.cc?`, cc ${inv.cc}`:'';
  alert(`Past-due reminder emailed to ${inv.email}${ccNote}, with a copy of invoice ${inv.id} attached — ${fmtMoney(invBalance(inv))} due (originally due ${fmtDate(inv.due)}).`);
}

function updateStats(){
  document.getElementById('sidebar-footer').textContent='';
}

function updateRangeMode(){
  const mode=document.getElementById('range-mode').value;
  document.getElementById('range-single-fields').style.display=mode==='single'?'flex':'none';
  document.getElementById('range-dual-fields').style.display=mode==='range'?'flex':'none';
}

function getSelectedRangeDates(){
  const mode=document.getElementById('range-mode').value;
  if(mode==='today'){
    const today=new Date().toISOString().slice(0,10);
    return{fromStr:today,toStr:today};
  }
  if(mode==='single'){
    const d=document.getElementById('range-single').value;
    return{fromStr:d,toStr:d};
  }
  return{fromStr:document.getElementById('range-from').value,toStr:document.getElementById('range-to').value};
}

function buildInvoices(){
  const{fromStr,toStr}=getSelectedRangeDates();
  const from=new Date(fromStr+'T00:00:00');
  const to=new Date(toStr+'T23:59:59');
  const group=document.getElementById('build-group').value;
  const inRange=ORDERS.filter(o=>{const d=new Date(o.date+'T00:00:00');return d>=from&&d<=to;});
  buildGroups=[];
  buildSearched=true;
  if(!inRange.length){renderBuildResults();return;}
  const grouped={};
  inRange.forEach(o=>{
    const keys=[];
    if(group==='agent'||group==='both') keys.push('ag-'+o.agentId);
    if(group==='office'||group==='both'){const a=AGENTS.find(x=>x.id===o.agentId);if(a)keys.push('off-'+a.officeId);}
    keys.forEach(k=>{if(!grouped[k])grouped[k]=[];grouped[k].push(o);});
  });
  buildGroups=Object.entries(grouped).map(([key,orders])=>{
    const isOff=key.startsWith('off-');
    const eid=parseInt(key.split('-')[1]);
    const entity=isOff?OFFICES.find(o=>o.id===eid):AGENTS.find(a=>a.id===eid);
    if(!entity)return null;
    const billableOrders=orders.filter(o=>isBillable(o.type));
    if(billableOrders.length===0)return null; // nothing billable (e.g. only a removal) — don't create a $0 invoice
    const total=billableOrders.reduce((s,o)=>s+o.amount,0);
    const name=isOff?entity.name:entity.first+' '+entity.last;
    const company=isOff?entity.name:(OFFICES.find(o=>o.id===entity.officeId)?.name||'—');
    return{key,isOff,entity,company,orders,billableOrders,total,name,email:entity.email,cc:entity.ccEmail||'',billing:entity.billing,excluded:false};
  }).filter(Boolean);
  renderBuildResults();
}

function renderBuildResults(){
  const included=buildGroups.filter(g=>!g.excluded);
  const excluded=buildGroups.filter(g=>g.excluded);
  const includedTotal=included.reduce((s,g)=>s+g.total,0);
  if(buildGroups.length===0){
    document.getElementById('build-results').innerHTML=buildSearched
      ?'<div style="padding:16px;color:#000;font-size:13px">No orders found in this date range.</div>'
      :'';
    document.getElementById('build-action-bar').style.display='none';
    document.getElementById('build-results-wrap').style.display='none';
    return;
  }
  document.getElementById('build-results').innerHTML=`
    <table class="inv-table">
      <thead><tr><th></th><th>Company</th><th>Name</th><th>Amount</th></tr></thead>
      <tbody>
      ${buildGroups.map(g=>{
        const on=!g.excluded;
        return`<tr style="opacity:${on?'1':'.5'}" onclick="toggleBuildExclude('${g.key}')">
          <td style="width:24px"><div class="check-cell${on?' on':''}">${on?'✓':''}</div></td>
          <td style="font-size:12px;font-weight:600">${g.company}</td>
          <td><div style="font-size:13px;font-weight:600">${g.name}</div><div style="font-size:11px;color:#000">${g.email}</div>${g.cc?`<div style="font-size:10.5px;color:#000">cc: ${g.cc}</div>`:''}</td>
          <td style="font-weight:600">${fmtMoney(g.total)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;

  document.getElementById('build-results-wrap').style.display='block';

  let pdfs=0,receipts=0,links=0;
  included.forEach(g=>{
    if(g.billing==='invoice')pdfs++;else if(g.billing==='auto')receipts++;else links++;
  });
  const parts=[];
  if(pdfs)parts.push(`${pdfs} PDF invoice${pdfs!==1?'s':''} emailed`);
  if(receipts)parts.push(`${receipts} autopay receipt${receipts!==1?'s':''} emailed`);
  if(links)parts.push(`${links} pay-now link${links!==1?'s':''} sent`);

  document.getElementById('build-action-bar').style.display='flex';
  document.getElementById('build-selection-label').innerHTML=
    `<b>${included.length} selected · $${includedTotal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</b>`+
    (excluded.length?` · ${excluded.length} unselected`:'')+
    (parts.length?`<div style="font-size:11px;color:#000;font-weight:400;margin-top:2px">Hitting send now will: ${parts.join(', ')}</div>`:'');
  document.getElementById('build-send-btn').disabled=included.length===0;
}

function setAllBuildExcluded(excluded){
  buildGroups.forEach(g=>g.excluded=excluded);
  renderBuildResults();
}

function toggleBuildExclude(key){
  const g=buildGroups.find(x=>x.key===key);
  if(g)g.excluded=!g.excluded;
  renderBuildResults();
}

function sendBuiltInvoices(){
  const included=buildGroups.filter(g=>!g.excluded);
  if(!included.length){alert('Nothing selected to send.');return;}
  const{fromStr:from,toStr:to}=getSelectedRangeDates();
  const period=new Date(from+'T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
  const dueDate=new Date(new Date(to+'T00:00:00').getTime()+30*86400000).toISOString().slice(0,10);
  const sentAt=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  let pdfs=0,links=0;
  included.forEach(g=>{
    const id='INV-'+String(nextInvoiceNum++).padStart(3,'0');
    const orderIds=g.orders.map(o=>o.id);
    INVOICES.push({
      id, billTo:g.name, email:g.email, cc:g.cc, type:g.isOff?'office':'agent',
      agentId:g.isOff?undefined:g.entity.id, officeId:g.isOff?g.entity.id:undefined,
      period, sentAt, amount:g.total, status:'unpaid', due:dueDate, billing:g.billing,
      orders:orderIds, payments:[]
    });
    g.billing==='invoice'?pdfs++:links++;
  });
  alert(`Created and sent ${included.length} invoice${included.length!==1?'s':''}.\n\n${pdfs} PDF invoice${pdfs!==1?'s':''} emailed\n${links} pay-now link${links!==1?'s':''} sent`);
  buildGroups=buildGroups.filter(g=>g.excluded); // keep only the unselected ones on screen, ready to export
  renderBuildResults();
  renderInvTable();updateStats();renderHistoryTable();
}

function exportExcludedBuild(){
  const excluded=buildGroups.filter(g=>g.excluded);
  if(!excluded.length){alert('Nothing unselected to export.');return;}
  alert(`Exporting ${excluded.length} invoice${excluded.length!==1?'s':''} to Excel for manual sending:\n\n`+excluded.map(g=>`${g.name} — ${fmtMoney(g.total)}`).join('\n'));
}

function exportExcel(){alert('Exporting to Excel...');}

updateStats();renderInvTable();renderHistoryTable();
</script>
</body>
